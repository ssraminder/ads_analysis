[phases.setup]
nixPkgs = [
    "python311",
    "postgresql",
    # Playwright browser dependencies
    "nss",
    "nspr",
    "atk",
    "at-spi2-atk",
    "cups",
    "libdrm",
    "libxkbcommon",
    "xorg.libXcomposite",
    "xorg.libXdamage",
    "xorg.libXfixes",
    "xorg.libXrandr",
    "mesa",
    "alsa-lib",
    "pango",
    "cairo",
    "expat",
    "glib",
    "gtk3",
    "dbus"
]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "playwright install chromium"
]

[start]
cmd = "uvicorn src.api.main:app --host 0.0.0.0 --port ${PORT:-8000}"

[variables]
PYTHONPATH = "/app"
